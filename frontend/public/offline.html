
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="theme-color" content="#176b52" />
    <title>Offline — DukaanFlow</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f7f8f4;
        color: #17372c;
        font-family: Arial, sans-serif;
      }

      main {
        width: 100%;
        max-width: 420px;
        background: white;
        border: 1px solid #dce8de;
        border-radius: 20px;
        padding: 36px 28px;
        text-align: center;
      }

      .logo {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        margin: 0 auto 24px;
        border-radius: 16px;
        background: #176b52;
        color: white;
        font-size: 36px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 25px;
      }

      p {
        margin: 16px 0 24px;
        color: #64766a;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 12px;
        background: #176b52;
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="logo" aria-hidden="true">D</div>

      <h1>You're offline</h1>

      <p>
        DukaanFlow needs an internet connection to
        access live stock, prices and place orders.
        Reconnect to continue.
      </p>

      <a href="/">Try again</a>
    </main>
  </body>
</html>
